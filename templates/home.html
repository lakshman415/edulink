{% extends 'main.html' %}
{% block content %}
<style>
  .card {
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
    transition: 0.3s;
    width: 35rem;
    margin: 2.5rem 5rem 5rem;
    float: left;
    
  }
  .card:hover {
    box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
  }
  .card-body {
    padding: 1rem;
  }
  .card-title {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 1rem;
  }
  .card-text {
    font-size: 1.6rem;
    margin-bottom: 1rem;
    
  }
  .btn-primary {
    background-color: #65ddef;
    border-color: #007BFF;
    color: #fff;
    margin-top: 1rem;
  }
  .clear {
    clear: both;
  }
</style>
<div class="container">
<div class="card-deck">
  {% for article in articles %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ article.title }}</h5>
        <p class="card-text">{{ article.author }}</p>
        <a
        href="{% url 'article_detail' article.pk %}"
        class="btn btn-primary"
        >Read More</a
      >
      </div>
  </div>
  {% endfor %}
  <div class="clear"></div>
</div>
</div>

{% endblock content %}
