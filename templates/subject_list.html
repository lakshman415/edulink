{% extends 'main.html' %}

{% block content %}
  <center> <h3 class="text-center" style="color: #121213; font-family: 'Arial', sans-serif; font-size: 1.25em;">Subjects of Electronics and Computer Engineering (VR-19)</h3> </center>
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between flex-wrap">
          {% for subject in subjects %}
            <a href="{% url 'material_list' subject.id %}" class="btn btn-primary subject-btn"  style="margin-right: 3rem; margin-bottom: 3rem;">{{ subject.name }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <style>
    .subject-btn {
      width: 267px;
      height: 60px;
    }
  </style>
{% endblock %}
