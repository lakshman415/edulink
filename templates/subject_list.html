{% extends 'main.html' %}

{% block content %}
  <center> <h1 class="text-center" style="color: #121213; font-weight: bold; font-family: 'Arial', sans-serif; font-size: 1.25em;">Subjects</h1> </center>
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between flex-wrap">
          {% for subject in subjects %}
            <a href="{% url 'material_list' subject.id %}" class="btn btn-primary"  style="margin-right: 2rem; margin-bottom: 1rem;">{{ subject.name }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
