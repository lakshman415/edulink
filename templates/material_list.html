{% extends 'main.html' %}

{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between flex-wrap">
          {% if files %}
            {% for file in files %}
              <a href="{% url 'download_file' file.name %}" target="_blank" class="btn btn-primary subject-btn" style="margin-top: 3rem; margin-right: 2.5rem; margin-bottom: 2.5rem;">{{ file.name }}</a>
            {% endfor %}
          {% else %}
          <div style="display: flex; justify-content: center; align-items: center; height: 90vh;">
            <center>  <h1> <p>Materials for this subject will be uploaded soon.</p></h1></center>
        </div>
        {% endif %}
      </div>
      </div> 
    </div>
  </div>
  <style>
    .subject-btn {
      width: 267px;
      height: 60px;
    }
   
  </style>
{% endblock %}
